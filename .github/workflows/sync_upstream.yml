name: Sync Upstream

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Upstream branch to sync'
        required: true
        default: 'main'
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/crimera/piko.git
          git fetch upstream "${{ inputs.branch }}"

      - name: Merge upstream
        run: git merge "upstream/${{ inputs.branch }}" --no-edit

      - name: Push synchronized branch
        run: git push origin HEAD:main
